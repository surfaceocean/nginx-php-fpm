name: Build

on:
  push:
    branches: [main]
    paths-ignore: [versions.json, README.md]
  pull_request:
    branches: [main]
    paths-ignore: [versions.json, README.md]
  schedule:
      - cron: '23 11 * * *'
        timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and version commits; PR builds have their own group.
concurrency:
  group: images-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/nginx-php-fpm
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'surfaceocean/nginx-php-fpm' }}

jobs:
  configure:
    name: Validate PHP version configuration
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      php: ${{ steps.versions.outputs.php }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read configured PHP versions
        id: versions
        run: |
          versions=$(python3 scripts/php_versions.py --json)
          printf 'php=%s\n' "$versions" >> "$GITHUB_OUTPUT"

      - name: Check version configuration and inventory validation
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check build and image test script syntax
        run: |
          bash -n build.sh
          bash -n scripts/test-image.sh

  build:
    name: PHP ${{ matrix.php }} / ${{ matrix.arch }}
    needs: configure
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        php: ${{ fromJSON(needs.configure.outputs.php) }}
        arch: [amd64, arm64]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          machine_arch=$(uname -m)
          case "$TARGET_ARCH/$machine_arch" in
            amd64/x86_64|arm64/aarch64) ;;
            *) echo "Runner architecture $machine_arch does not match $TARGET_ARCH" >&2; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build current PHP and extension releases
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_RETENTION_DAYS: '7'
        with:
          context: .
          file: ./src/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: phpVersion=${{ matrix.php }}
          pull: true
          no-cache: true
          load: true
          push: false
          tags: nginx-php-fpm:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify extensions, services and HTTP
        run: bash scripts/test-image.sh nginx-php-fpm:test '${{ matrix.php }}' 'linux/${{ matrix.arch }}'

      - name: Read versions from the built image
        run: |
          mkdir -p manifests
          docker run --rm --platform 'linux/${{ matrix.arch }}' \
            --entrypoint php nginx-php-fpm:test /usr/local/bin/build-versions.php \
            > runtime-versions.json

      # Candidate tags are never used as supported release aliases. Publication
      # below waits for every PHP/architecture combination to pass its tests.
      - name: Push tested architecture image
        if: env.PUBLISH == 'true'
        id: push
        env:
          CANDIDATE: ${{ env.IMAGE }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.php }}-${{ matrix.arch }}
        run: |
          docker tag nginx-php-fpm:test "$CANDIDATE"
          docker push "$CANDIDATE"
          reference=$(docker image inspect "$CANDIDATE" --format '{{index .RepoDigests 0}}')
          echo "digest=${reference##*@}" >> "$GITHUB_OUTPUT"

      - name: Record versions and immutable image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          python3 scripts/update-versions.py --record-manifest runtime-versions.json \
            --php '${{ matrix.php }}' --platform 'linux/${{ matrix.arch }}' \
            --image "$IMAGE" --digest "$DIGEST" \
            --output 'manifests/${{ matrix.php }}-${{ matrix.arch }}.json'

      - name: Upload architecture manifest
        uses: actions/upload-artifact@v7
        with:
          name: versions-${{ matrix.php }}-${{ matrix.arch }}
          path: manifests/*.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish manifests and versions.json
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'surfaceocean/nginx-php-fpm'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publication.outputs.published }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Download architecture manifests
        uses: actions/download-artifact@v8
        with:
          pattern: versions-*
          path: manifests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether this is still the current source
        id: source
        if: env.PUBLISH == 'true'
        run: |
          git fetch origin main
          git show origin/main:versions.json > previous-versions.json
          if git diff --quiet "$GITHUB_SHA" origin/main -- . ':!versions.json'; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'New source changes are on main; this run will not replace release tags or versions.json.'
          fi

      - name: Assemble release images and root versions.json
        id: publication
        env:
          CURRENT_SOURCE: ${{ steps.source.outputs.current }}
        run: |
          args=()
          published=false
          if [[ "$PUBLISH" == true && "$CURRENT_SOURCE" == true ]]; then
            args+=(--publish)
            published=true
          fi
          python3 scripts/update-versions.py --records manifests --image "$IMAGE" \
            --source-sha "$GITHUB_SHA" --source-repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output versions.json "${args[@]}"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Upload root versions.json
        uses: actions/upload-artifact@v7
        with:
          name: versions
          path: |
            versions.json
            previous-versions.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit versions.json to main
        if: env.PUBLISH == 'true' && steps.source.outputs.current == 'true'
        run: |
          cp versions.json "$RUNNER_TEMP/versions.json"
          git fetch origin main
          if ! git diff --quiet "$GITHUB_SHA" origin/main -- . ':!versions.json'; then
            echo 'Source changed during publication; leave the manifest as an artifact for this run.'
            exit 0
          fi
          git restore -- versions.json
          git switch --detach origin/main
          cp "$RUNNER_TEMP/versions.json" versions.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add versions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: record built component versions [skip ci]'
          # A concurrent main update causes a safe, non-forced rejection.
          git push origin HEAD:main

  cleanup:
    name: Clean temporary tags and unreferenced images
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out cleanup scripts and complete inventory history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download published and previous version inventories
        uses: actions/download-artifact@v8
        with:
          name: versions
          path: published

      - name: Collect all recorded historical image digests
        run: |
          python3 scripts/collect-dockerhub-digests.py --image "$IMAGE" \
            --output published/historical-digests.json

      - name: Remove temporary tags and known unreferenced images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 scripts/cleanup-dockerhub.py --image "$IMAGE" \
            --versions published/versions.json \
            --previous-versions published/previous-versions.json \
            --known-digests published/historical-digests.json --delete
